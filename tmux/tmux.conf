# ── Prefix: Ctrl-a ────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Catppuccin Macchiato theme (cloned by install.sh) ─────────────────────
set -g @catppuccin_flavor "macchiato"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# ── Status bar on top ──────────────────────────────────────────────────────
set -g status-position top
# ── Window / pane numbering starts at 1 ───────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-option -g allow-rename off
# ── Terminal colours ───────────────────────────────────────────────────────
set -sg escape-time 0
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -g monitor-activity off
set -g visual-activity off
set -g allow-passthrough all
set -g set-clipboard on
# ── Mouse: click panes/windows, drag borders to resize, wheel scrolls ─────
# Drag-selecting copies to the clipboard (OSC 52). Hold Shift in WezTerm to
# bypass tmux and use the terminal's own selection.
set -g mouse on
# ── Copy mode: vi keys + OSC 52 clipboard ─────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi y     send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
# ── Intuitive splits ───────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# ── Pane navigation: vim-style ─────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# ── Reload config ──────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  Config reloaded!"

# ── Machine-specific overrides (not in the repo) ───────────────────────────
source-file -q ~/.config/tmux/local.conf
