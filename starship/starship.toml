add_newline = false
# Line 1: directory, then everything else (git, aws, languages...).
# Line 2: just the cursor, so long paths and profiles don't push it right.
format = """$directory$all$line_break$character"""
palette = "catppuccin_macchiato"
command_timeout = 1000

[character]
vicmd_symbol = "[N] >>>"
success_symbol = '[➜](bold green)'

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '

[aws]
format = '[$symbol($profile )(\($region\) )]($style)'
disabled = false
style = 'bold blue'
symbol = " "

[golang]
format = '[ ](bold cyan)'

[kubernetes]
symbol = '☸ '
disabled = true
format = '[$symbol$context( \($namespace\))]($style) '

[docker_context]
disabled = true

