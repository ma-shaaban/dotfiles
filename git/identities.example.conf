# Example only. The real file is ~/.config/dotfiles/identities.conf (never
# committed). On a new machine, ssh-unlock fetches it from the Bitwarden
# secure note "dotfiles-identities" (the note's text is this file's content).
#
# One git identity per line, applied to every repo under ~/<dir>/ (dir is
# relative to ~). Projects are grouped by client under ~/work; this repo lives
# in ~/work/personal/dotfiles, so it uses the personal identity.
#   dir | name | email | auth key | signing key
# Key names are Bitwarden "SSH key" item names. ssh-unlock loads them into
# ssh-agent and writes ~/.ssh/<name>.pub; commits and tags are SSH-signed
# through the agent.
work/personal | Jane Doe | jane@example.com     | id_ed25519_personal_authn | id_ed25519_personal_signing
work/acme     | Jane Doe | jane@acme.example    | id_ed25519_acme_authn     | id_ed25519_acme_signing
work/globex   | Jane Doe | jane@globex.example  | id_ed25519_globex_authn   | id_ed25519_globex_signing
